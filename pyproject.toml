[project]
name = "n31l"
version = "2.5.1"
description = "N31L is a utilitarian bot for the Call of Duty server."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "environs>=15.0.1",
    "loguru>=0.7.3",
    "loguru-discord>=2.1.0",
    "hikari-arc>=2.3.0",
    "asyncpraw>=7.8.1",
    "urlextract>=1.9.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "niquests>=3.18.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "asyncpraw-stubs>=0.0.3",
    "ty>=0.0.40",
]

[tool.ruff]
fix = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
split-on-trailing-comma = false
