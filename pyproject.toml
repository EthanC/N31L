[project]
name = "n31l"
version = "2.5.0"
description = "N31L is a utilitarian bot for the Call of Duty server."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "environs>=14.5.0",
    "loguru>=0.7.3",
    "loguru-discord>=2.0.1",
    "hikari-arc>=2.1.1",
    "httpx>=0.28.1",
    "asyncpraw>=7.8.1",
    "urlextract>=1.9.0",
    "uvloop>=0.22.0; sys_platform != 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "asyncpraw-stubs>=0.0.3",
    "ty>=0.0.6",
]

[tool.ruff]
fix = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
split-on-trailing-comma = false
