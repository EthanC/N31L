[project]
name = "n31l"
version = "2.5.2"
description = "N31L is a utilitarian bot for the Call of Duty server."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "environs>=15.2.0",
    "loguru>=0.7.3",
    "loguru-discord>=2.2.0",
    "hikari-arc>=2.3.2",
    "asyncpraw>=8.0.3",
    "urlextract>=1.10.0",
    "uvloop>=0.23.0; sys_platform != 'win32'",
    "niquests>=3.21.2",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.ruff]
fix = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
split-on-trailing-comma = false
